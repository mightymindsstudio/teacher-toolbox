<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Centers | Teacher Toolbox</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;background:#fff7f8}
body{display:flex;justify-content:center;font-family:Arial,sans-serif}

.stage{
  position:relative;
  width:min(100vw,1024px);
  aspect-ratio:2/3;
}

.stage>img{
  width:100%;
  height:100%;
  display:block;
}

.hit{
  position:absolute;
  display:block;
  border:0;
  background:transparent;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

/* MAIN TOOLS */
.rotation{
  left:11.5%;
  top:47.8%;
  width:29%;
  height:5.2%;
}

.skill{
  left:59%;
  top:47.8%;
  width:28%;
  height:5.2%;
}

/* QUICK CENTER IDEAS */
.q1{left:6%;top:64.7%;width:13%;height:12.5%}
.q2{left:20.5%;top:64.7%;width:13%;height:12.5%}
.q3{left:35.5%;top:64.7%;width:13%;height:12.5%}
.q4{left:50.7%;top:64.7%;width:13%;height:12.5%}
.q5{left:65.7%;top:64.7%;width:13%;height:12.5%}
.q6{left:80.7%;top:64.7%;width:13%;height:12.5%}

/* POP-UP */
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#17315d66;
  z-index:20;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.modal.show{display:flex}

.box{
  background:#fffaf7;
  border:3px solid #ff9fbd;
  border-radius:24px;
  padding:22px;
  max-width:540px;
  width:100%;
  box-shadow:0 10px 35px #17315d33;
  color:#17315d;
}

.box h2{
  color:#ef5d8b;
  margin-top:0;
}

.ideas{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.idea{
  padding:10px;
  border-radius:12px;
  background:#fff0f5;
  font-weight:700;
}

.close{
  float:right;
  border:0;
  border-radius:50%;
  width:36px;
  height:36px;
  background:#f3e9ff;
  font-size:22px;
  cursor:pointer;
}

.toast{
  position:fixed;
  bottom:20px;
  background:#17315d;
  color:white;
  padding:10px 16px;
  border-radius:30px;
  opacity:0;
  transition:.2s;
  z-index:30;
}

.toast.show{opacity:1}
</style>
</head>

<body>

<div class="stage">

<img src="https://raw.githubusercontent.com/mightymindsstudio/teacher-toolbox/main/centers-dashboard-bg.png.PNG" alt="Centers Teacher Toolbox">

<a
  class="hit rotation"
  href="center-rotation-board-cute.html?v=8001"
  aria-label="Open Center Rotation Board">
</a>

<a
  class="hit skill"
  href="skill-based-centers.html?v=1"
  aria-label="Skill-Based Center Ideas">
</a>

<button class="hit q1" onclick="ideas('Read to Self')"></button>
<button class="hit q2" onclick="ideas('Word Work')"></button>
<button class="hit q3" onclick="ideas('Read with a Buddy')"></button>
<button class="hit q4" onclick="ideas('Listen to Reading')"></button>
<button class="hit q5" onclick="ideas('Create')"></button>
<button class="hit q6" onclick="ideas('Partner')"></button>

</div>

<div class="modal" id="modal"
onclick="if(event.target===this)closeM()">

<div class="box">

<button class="close" onclick="closeM()">×</button>

<h2 id="title"></h2>

<div class="ideas" id="list"></div>

</div>
</div>

<div class="toast" id="toast"></div>

<script>

const data={

"Read to Self":[
"Book Nook",
"Reading Stamina",
"Independent Reading",
"Read & Retell",
"Character Detective",
"Story Map",
"Favorite Part",
"Picture Walk"
],

"Word Work":[
"Letter Fun",
"Phonics Games",
"Spelling Practice",
"Build It With Letters",
"Rainbow Write",
"Word Sort",
"Word Hunt",
"Change-a-Sound"
],

"Read with a Buddy":[
"Buddy Reading",
"Partner Talk",
"Retell Together",
"Take Turns Reading",
"Character Chat",
"Sequence Together",
"Ask & Answer",
"Favorite Part Share"
],

"Listen to Reading":[
"Audiobooks",
"Read-Aloud",
"Listening Center",
"Listen & Retell",
"Draw What You Heard",
"Story Sequence",
"Favorite Part",
"Character Hunt"
],

"Create":[
"Draw & Write",
"Craft & Build",
"Design & Make",
"Story Illustration",
"STEM Build",
"Shape Picture",
"Make a Poster",
"Build a Model"
],

"Partner":[
"Math Partners",
"Game Time",
"Problem Solve",
"Quiz a Friend",
"Roll & Solve",
"Memory Match",
"Teach Your Partner",
"Task Card Team"
]

};

function ideas(k){

document.getElementById('title').textContent=k+' Ideas';

document.getElementById('list').innerHTML=
data[k].map(x=>'<div class="idea">♡ '+x+'</div>').join('');

document.getElementById('modal').classList.add('show');

}

function closeM(){
document.getElementById('modal').classList.remove('show');
}

let tt;

function toast(m){

let t=document.getElementById('toast');

t.textContent=m;

t.classList.add('show');

clearTimeout(tt);

tt=setTimeout(()=>t.classList.remove('show'),1800);

}

</script>

</body>
</html>
