.celebrate.show{opacity:1}

  position:fixed;
  top:-40px;
  z-index:999;
  pointer-events:none;
  animation:fall 2.8s linear forwards;
}

@keyframes fall{
  to{
    transform:translateY(110vh) rotate(720deg);
    opacity:.8
  }
}

@media(max-width:650px){
  .back{
    font-size:12px;
    padding:7px 11px;
  }

  .favbox{
    padding:4px;
  }

    padding:4px 3px;
    margin-bottom:3px;
  }
}
