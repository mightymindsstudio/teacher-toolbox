<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8dbe7">
<title>Reading | Teacher Toolbox</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#fff7f4}
body{display:flex;justify-content:center;align-items:flex-start}
.stage{position:relative;width:min(100vw,1024px);aspect-ratio:2/3;background:#fff;overflow:hidden}
.stage>img{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.hit{position:absolute;z-index:8;display:block;border-radius:18px;outline:none;-webkit-tap-highlight-color:transparent}
.hit:focus-visible{box-shadow:0 0 0 4px rgba(255,79,145,.65)}
.home{left:1.7%;top:2.0%;width:16.4%;height:5.4%}
.favorites{left:79.7%;top:2.0%;width:18.2%;height:5.4%}

/* Main reading cards */
.unite{left:2.2%;top:33.5%;width:31.9%;height:44.5%}
.project{left:35.3%;top:33.5%;width:29.7%;height:44.5%}
.epic{left:66.3%;top:33.5%;width:31.3%;height:44.5%}

/* Quick tools */
.timer{left:4.9%;top:84.9%;width:13.3%;height:10.0%}
.picker{left:20.3%;top:84.9%;width:13.0%;height:10.0%}
.group{left:35.6%;top:84.9%;width:13.3%;height:10.0%}
.noise{left:51.1%;top:84.9%;width:13.2%;height:10.0%}
.message{left:66.6%;top:84.9%;width:14.0%;height:10.0%}
.whatdo{left:81.7%;top:84.9%;width:14.4%;height:10.0%}

.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(15px);background:#26334f;color:white;padding:10px 16px;border-radius:999px;font:800 14px Arial,sans-serif;opacity:0;pointer-events:none;transition:.2s;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:620px){body{background:#fff}.stage{width:100vw}}
</style>
</head>
<body>
<main class="stage" aria-label="Teacher Toolbox Reading page">
<img src="reading-final-bg.png" alt="Teacher Toolbox Reading page with Unite for Literacy, Project Read AI, and Epic">

<a class="hit home" href="index.html" aria-label="Home"></a>
<a class="hit favorites" href="#" data-coming="My Favorites" aria-label="My Favorites"></a>

<a class="hit unite" href="https://prod-cloud.uniteforliteracy.com/free-books-online/home" target="_blank" rel="noopener" aria-label="Visit Unite for Literacy"></a>
<a class="hit project" href="https://www.projectread.ai/" target="_blank" rel="noopener" aria-label="Visit Project Read AI"></a>
<a class="hit epic" href="https://www.getepic.com/sign-in" target="_blank" rel="noopener" aria-label="Visit Epic"></a>

<a class="hit timer" href="timer.html" aria-label="Class Timer"></a>
<a class="hit picker" href="student-picker.html" aria-label="Student Picker"></a>
<a class="hit group" href="group-maker.html" aria-label="Group Maker"></a>
<a class="hit noise" href="noise-meter.html" aria-label="Noise Meter"></a>
<a class="hit message" href="morning-message-final.html?v=2" aria-label="Morning Message"></a>
<a class="hit whatdo" href="what-can-i-do.html?v=3" aria-label="What Can I Do"></a>
</main>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
const toast=document.getElementById('toast');let timer;
document.querySelectorAll('[data-coming]').forEach(el=>{
  el.addEventListener('click',e=>{
    e.preventDefault();clearTimeout(timer);
    toast.textContent=el.dataset.coming+' — coming soon! 💕';
    toast.classList.add('show');
    timer=setTimeout(()=>toast.classList.remove('show'),1600);
  });
});
</script>
</body>
</html>
