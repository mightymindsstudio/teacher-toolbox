<script>

let toastTimer;

function showMessage(message){

  const toast=document.getElementById("toast");

  toast.textContent=message;
  toast.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer=setTimeout(function(){
    toast.classList.remove("show");
  },1800);
}
