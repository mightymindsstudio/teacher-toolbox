<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brain Break Machine</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  background:#fffaf5;
  font-family:Arial,Helvetica,sans-serif;
}

.back{
  display:inline-block;
  margin:10px 12px;
  padding:9px 14px;
  background:#fff;
  border-radius:999px;
  text-decoration:none;
  color:#6f6786;
  font-weight:800;
  box-shadow:0 4px 14px rgba(0,0,0,.1);
}

.stage{
  position:relative;
  width:100%;
  max-width:1536px;
  margin:auto;
  aspect-ratio:3/2;
}

.stage img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}

.hit{
  position:absolute;
  border:0;
  background:transparent;
  cursor:pointer;
  z-index:20;
  -webkit-tap-highlight-color:transparent;
}

/* CATEGORY BUTTONS */
.energize{
  left:1.4%;
  top:17.7%;
  width:15.1%;
  height:14.1%;
}

.calm{
  left:17.2%;
  top:17.7%;
  width:16.2%;
  height:14.1%;
}

.move{
  left:34.3%;
  top:17.7%;
  width:15.1%;
  height:14.1%;
}

.silly{
  left:50.2%;
  top:17.7%;
  width:14.8%;
  height:14.1%;
}

.focus{
  left:65.9%;
  top:17.7%;
  width:16.4%;
  height:14.1%;
}

.surprise{
  left:83.2%;
  top:17.7%;
  width:15.3%;
  height:14.1%;
}

/* BIG GUMBALL BUTTON */
.give{
  left:17.0%;
  top:47.0%;
  width:27.5%;
  height:19.5%;
}

/* START BUTTON */
.start{
  left:76.7%;
  top:74.7%;
  width:18.6%;
  height:10.5%;
}

/* ANOTHER ONE BUTTON */
.another{
  left:55.0%;
  top:86.0%;
  width:40.5%;
  height:9.2%;
}

/* LIVE RESULT AREA */
.result{
  position:absolute;
  z-index:12;
  left:54.8%;
  top:36.8%;
  width:40.5%;
  height:34.2%;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  pointer-events:none;
}

.result-inner{
  width:100%;
  padding:0 7%;
  background:transparent;
}

.emoji{
  font-size:clamp(24px,3.5vw,54px);
  line-height:1;
  margin-bottom:6px;
}

.title{
  font-weight:900;
  color:#14a6b0;
  font-size:clamp(16px,2.6vw,40px);
  line-height:1.05;
  margin:0 0 12px;
}

.desc{
  color:#333;
  font-weight:700;
  font-size:clamp(10px,1.35vw,20px);
  line-height:1.25;
  max-width:82%;
  margin:auto;
}

.duration{
  margin:12px auto 0;
  width:max-content;
  max-width:90%;
  padding:5px 14px;
  background:#fff0f4;
  border:2px solid #f9a9bd;
  border-radius:999px;
  color:#d94976;
  font-weight:900;
  font-size:clamp(9px,1.05vw,17px);
}

/* LIVE TIMER */
.timer{
  position:absolute;
  z-index:14;
  left:55.0%;
  top:74.7%;
  width:18.9%;
  height:10.5%;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-weight:900;
  color:#12a7b0;
  font-size:clamp(20px,3.7vw,56px);
  background:#fffaf5;
  border-radius:18px;
  pointer-events:none;
}

/* SELECTED CATEGORY */
.glow{
  outline:4px solid rgba(255,255,255,.95);
  border-radius:22px;
  box-shadow:0 0 0 5px rgba(255,211,65,.78);
}

/* FINISHED MESSAGE */
.celebrate{
  position:absolute;
  z-index:30;
  left:56%;
  top:67%;
  width:37%;
  text-align:center;
  font-size:clamp(12px,1.6vw,24px);
  font-weight:900;
  color:#ff5b8a;
  background:#fff7c7;
  border-radius:999px;
  padding:5px 8px;
  opacity:0;
  transition:.2s;
  pointer-events:none;
}

.celebrate.show{
  opacity:1;
}

/* CONFETTI */
.confetti{
  position:fixed;
  top:-30px;
  pointer-events:none;
  z-index:9999;
  animation:fall 2.7s linear forwards;
}

@keyframes fall{
  to{
    transform:translateY(110vh) rotate(700deg);
    opacity:.85;
  }
}

@media(max-width:600px){
  .back{
    font-size:12px;
    padding:7px 11px;
  }
}
</style>
</head>

<body>

<a class="back"
href="classroom-management-new.html?v=960001">
← Back to Classroom Management
</a>

<div class="stage">

<img
src="https://raw.githubusercontent.com/mightymindsstudio/teacher-toolbox/main/brain-break-final-bg.PNG"
alt="Brain Break Machine">

<!-- CATEGORY BUTTONS -->

<button
class="hit energize glow"
data-cat="energize"
aria-label="Energize">
</button>

<button
class="hit calm"
data-cat="calm"
aria-label="Calm and Reset">
</button>

<button
class="hit move"
data-cat="move"
aria-label="Move It">
</button>

<button
class="hit silly"
data-cat="silly"
aria-label="Silly">
</button>

<button
class="hit focus"
data-cat="focus"
aria-label="Focus Boost">
</button>

<button
class="hit surprise"
data-cat="surprise"
aria-label="Surprise Me">
</button>

<!-- BIG MACHINE BUTTON -->

<button
class="hit give"
id="giveBreak"
aria-label="Give us a brain break">
</button>

<!-- LIVE RESULT -->

<div class="result">
  <div class="result-inner">

    <div class="emoji" id="emoji">
      ⚡
    </div>

    <div class="title" id="title">
      Jumping Jacks!
    </div>

    <div class="desc" id="desc">
      Do 20 jumping jacks together!
    </div>

    <div class="duration" id="duration">
      ⏱ 30 seconds
    </div>

  </div>
</div>

<!-- TIMER -->

<div class="timer" id="timer">
00:30
</div>

<!-- WORKING BUTTONS -->

<button
class="hit start"
id="startBtn"
aria-label="Start timer">
</button>

<button
class="hit another"
id="anotherBtn"
aria-label="Another brain break">
</button>

<div class="celebrate" id="celebrate">
🌟 BRAIN REFRESHED! 🌟
</div>

</div>

<script>

const breaks=[

/* ENERGIZE */

{
cat:"energize",
emoji:"⚡",
title:"Jumping Jacks!",
desc:"Do 20 jumping jacks together!",
seconds:30
},

{
cat:"energize",
emoji:"🚀",
title:"Rocket Launch!",
desc:"Crouch down, count backward from 10, then blast off with a giant jump!",
seconds:30
},

{
cat:"energize",
emoji:"🥁",
title:"Marching Band!",
desc:"March in place while pretending to play an instrument!",
seconds:45
},

{
cat:"energize",
emoji:"🌪️",
title:"Shake It Out!",
desc:"Shake your hands, arms, shoulders, legs, and whole body!",
seconds:30
},

{
cat:"energize",
emoji:"🐰",
title:"Bunny Bounce!",
desc:"Do tiny bunny hops in place!",
seconds:30
},

/* CALM */

{
cat:"calm",
emoji:"🌬️",
title:"Balloon Breathing",
desc:"Take five slow breaths. Fill your belly like a balloon, then slowly breathe out.",
seconds:45
},

{
cat:"calm",
emoji:"⭐",
title:"Star Stretch",
desc:"Stretch your arms and legs wide like a star. Hold, then relax.",
seconds:45
},

{
cat:"calm",
emoji:"☁️",
title:"Cloud Float",
desc:"Close your eyes and imagine floating gently on a soft cloud.",
seconds:45
},

{
cat:"calm",
emoji:"🌈",
title:"Rainbow Breaths",
desc:"Trace an imaginary rainbow while breathing in and out slowly.",
seconds:45
},

{
cat:"calm",
emoji:"💗",
title:"Hand on Heart",
desc:"Put your hand on your heart and take five peaceful breaths.",
seconds:45
},

/* MOVE IT */

{
cat:"move",
emoji:"🐧",
title:"Penguin Waddle!",
desc:"Waddle like a penguin around your space!",
seconds:30
},

{
cat:"move",
emoji:"💃",
title:"Freeze Dance!",
desc:"Dance in place. Freeze when your teacher says FREEZE!",
seconds:45
},

{
cat:"move",
emoji:"🦘",
title:"Kangaroo Jumps!",
desc:"Bounce gently like a kangaroo!",
seconds:30
},

{
cat:"move",
emoji:"🏊",
title:"Air Swimming!",
desc:"Pretend to swim through the air with giant arm strokes!",
seconds:30
},

{
cat:"move",
emoji:"🦋",
title:"Butterfly Wings!",
desc:"Flap your arms like giant butterfly wings!",
seconds:30
},

/* SILLY */

{
cat:"silly",
emoji:"🤪",
title:"Funny Face Freeze!",
desc:"Make your silliest face and freeze!",
seconds:30
},

{
cat:"silly",
emoji:"🤖",
title:"Robot Mode!",
desc:"Move like a slow, squeaky robot!",
seconds:45
},

{
cat:"silly",
emoji:"🐔",
title:"Chicken Dance!",
desc:"Flap your wings and wiggle your tail feathers!",
seconds:30
},

{
cat:"silly",
emoji:"🦖",
title:"Tiny T-Rex!",
desc:"Walk around with tiny T-Rex arms and giant dinosaur steps!",
seconds:30
},

{
cat:"silly",
emoji:"🍝",
title:"Wiggly Noodle!",
desc:"Pretend your whole body is a floppy noodle!",
seconds:30
},

/* FOCUS */

{
cat:"focus",
emoji:"🎯",
title:"Cross Crawl!",
desc:"Touch your right elbow to your left knee, then switch!",
seconds:45
},

{
cat:"focus",
emoji:"⚖️",
title:"Balance Challenge!",
desc:"Stand on one foot, then switch sides!",
seconds:30
},

{
cat:"focus",
emoji:"👏",
title:"Copy My Clap!",
desc:"Teacher claps a pattern. Students repeat it exactly!",
seconds:45
},

{
cat:"focus",
emoji:"👀",
title:"I Spy!",
desc:"Find three things in the room that are the same color!",
seconds:30
},

{
cat:"focus",
emoji:"🧠",
title:"Brain Pattern!",
desc:"Tap knees, clap, snap, clap. Repeat the pattern!",
seconds:45
}

];

let selected="energize";
let current=breaks[0];

let secondsLeft=current.seconds;
let interval=null;
let running=false;

const emoji=
document.getElementById("emoji");

const title=
document.getElementById("title");

const desc=
document.getElementById("desc");

const duration=
document.getElementById("duration");

const timer=
document.getElementById("timer");

const celebration=
document.getElementById("celebrate");


function pickBreak(){

  stopTimer();

  let options;

  if(selected==="surprise"){
    options=breaks;
  }
  else{
    options=
    breaks.filter(
      b=>b.cat===selected
    );
  }

  let next;

  do{

    next=
    options[
      Math.floor(
        Math.random()*options.length
      )
    ];

  }
  while(
    options.length>1 &&
    next.title===current.title
  );

  current=next;

  secondsLeft=
  current.seconds;

  render();
}


function render(){

  emoji.textContent=
  current.emoji;

  title.textContent=
  current.title;

  desc.textContent=
  current.desc;

  duration.textContent=
  current.seconds===60
  ? "⏱ 1 minute"
  : "⏱ "+current.seconds+" seconds";

  updateTimer();

  celebration
  .classList
  .remove("show");
}


function updateTimer(){

  const min=
  Math.floor(secondsLeft/60);

  const sec=
  secondsLeft%60;

  timer.textContent=
  String(min).padStart(2,"0")
  +":"
  +String(sec).padStart(2,"0");
}


function startTimer(){

  if(running){

    clearInterval(interval);

    interval=null;
    running=false;

    return;
  }

  if(secondsLeft<=0){

    secondsLeft=
    current.seconds;

    updateTimer();
  }

  running=true;

  interval=
  setInterval(()=>{

    secondsLeft--;

    updateTimer();

    if(secondsLeft<=0){

      clearInterval(interval);

      interval=null;
      running=false;

      celebration
      .classList
      .add("show");

      confetti();

      setTimeout(()=>{

        celebration
        .classList
        .remove("show");

      },4500);
    }

  },1000);
}


function stopTimer(){

  clearInterval(interval);

  interval=null;
  running=false;

  secondsLeft=
  current.seconds;

  updateTimer();
}


function confetti(){

  const pieces=[
    "⭐",
    "💗",
    "🌈",
    "✨",
    "🎉",
    "💫"
  ];

  for(let i=0;i<45;i++){

    const p=
    document.createElement("div");

    p.className=
    "confetti";

    p.textContent=
    pieces[
      Math.floor(
        Math.random()*pieces.length
      )
    ];

    p.style.left=
    Math.random()*100+"vw";

    p.style.fontSize=
    (14+Math.random()*18)+"px";

    p.style.animationDelay=
    (Math.random()*.6)+"s";

    document.body
    .appendChild(p);

    setTimeout(
      ()=>p.remove(),
      3400
    );
  }
}


/* CATEGORY BUTTONS */

document
.querySelectorAll("[data-cat]")
.forEach(btn=>{

  btn.addEventListener(
    "click",
    ()=>{

      document
      .querySelectorAll("[data-cat]")
      .forEach(
        b=>b.classList.remove("glow")
      );

      btn
      .classList
      .add("glow");

      selected=
      btn.dataset.cat;

      pickBreak();
    }
  );

});


/* MAIN BUTTON */

document
.getElementById("giveBreak")
.onclick=pickBreak;


/* ANOTHER ONE */

document
.getElementById("anotherBtn")
.onclick=pickBreak;


/* TIMER */

document
.getElementById("startBtn")
.onclick=startTimer;


/* INITIAL DISPLAY */

render();

</script>

</body>
</html>
