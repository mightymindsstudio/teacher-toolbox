*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#fff8f1}

.stage>img{position:absolute;inset:0;width:100%;height:100%;display:block}
.hit{position:absolute;z-index:5;display:block;border-radius:20px;-webkit-tap-highlight-color:transparent}
.home{left:1.6%;top:1.6%;width:17.2%;height:5.8%}.fav{left:80.2%;top:1.6%;width:18%;height:5.8%}
.sheppard{left:2.5%;top:29.7%;width:46%;height:22.9%}.toy{left:50.1%;top:29.7%;width:47.7%;height:22.9%}
.mlc{left:2.5%;top:53.5%;width:46%;height:22.8%}.topmarks{left:50.1%;top:53.5%;width:47.7%;height:22.8%}

.clock{left:52.6%;top:79.1%;width:11.6%;height:11.5%}.shape{left:64.7%;top:79.1%;width:11.6%;height:11.5%}
.spinner{left:76.8%;top:79.1%;width:10.7%;height:11.5%}.dice{left:87.7%;top:79.1%;width:10.2%;height:11.5%}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(15px);background:#23345d;color:#fff;padding:10px 16px;border-radius:999px;font:800 14px Arial;opacity:0;transition:.2s;z-index:20}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style></head><body>
<main class="stage"><img src="math-bg.png?v=1" alt="Teacher Toolbox Math page">
