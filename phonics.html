<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phonics Toolbox</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#f6d9e7}
body{display:flex;justify-content:center;align-items:flex-start}
.stage{position:relative;width:min(100vw,1536px);aspect-ratio:3/2;overflow:hidden;background:white}
.stage img{width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.hotspot{position:absolute;display:block;border-radius:18px;outline:none;-webkit-tap-highlight-color:transparent}
.hotspot:focus-visible{box-shadow:0 0 0 4px rgba(255,77,145,.7)}

.back{left:22.8%;top:4.1%;width:14.3%;height:5.3%}
.home{left:2.1%;top:38.8%;width:15.2%;height:5.3%}
.favnav{left:2.1%;top:45.0%;width:15.2%;height:5.2%}
.resnav{left:2.1%;top:50.8%;width:15.2%;height:5.2%}
.students{left:2.1%;top:56.7%;width:15.2%;height:5.2%}
.settings{left:2.1%;top:62.5%;width:15.2%;height:5.2%}

/* Resource cards */
.awareness{left:22.9%;top:34.7%;width:16.4%;height:21.7%}
.letters{left:40.8%;top:34.7%;width:16.4%;height:21.7%}
.skills{left:58.8%;top:34.7%;width:16.4%;height:21.7%}
.decodable{left:77.8%;top:34.7%;width:16.4%;height:21.7%}

.practice{left:22.9%;top:57.3%;width:16.4%;height:21.6%}
.spelling{left:40.8%;top:57.3%;width:16.4%;height:21.6%}
.hfw{left:58.8%;top:57.3%;width:16.4%;height:21.6%}
.games{left:77.8%;top:57.3%;width:16.4%;height:21.6%}

/* Quick tools */
.timer{left:23.5%;top:84.1%;width:10%;height:13.4%}
.picker{left:33.9%;top:84.1%;width:10%;height:13.4%}
.group{left:44.4%;top:84.1%;width:10%;height:13.4%}
.noise{left:54.9%;top:84.1%;width:10%;height:13.4%}
.message{left:65.4%;top:84.1%;width:10.5%;height:13.4%}
.whatdo{left:75.8%;top:84.1%;width:10.5%;height:13.4%}

#toast{
 position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(24px);
 background:rgba(25,45,81,.95);color:#fff;padding:11px 17px;border-radius:999px;
 font:700 14px Arial,sans-serif;opacity:0;pointer-events:none;transition:.2s;z-index:50
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<main class="stage" aria-label="Phonics Toolbox">
  <img src="phonics-toolbox-home.png" alt="Phonics Toolbox dashboard">

  <a class="hotspot back" href="index.html" aria-label="Back to Home"></a>
  <a class="hotspot home" href="index.html" aria-label="Home"></a>

  <a class="hotspot awareness" href="https://phonicademy.com/play" target="_blank" rel="noopener" aria-label="Phonemic Awareness"></a>
  <a class="hotspot letters" href="https://soundsforest.com/" target="_blank" rel="noopener" aria-label="Letter Recognition"></a>
  <a class="hotspot skills" href="https://phonicademy.com/roadmap/digraphs-blends" target="_blank" rel="noopener" aria-label="Phonics Skills"></a>
  <a class="hotspot decodable" href="https://readinguniverse.org/article/explore-teaching-topics/word-recognition/phonics/decodable-texts-for-each-phonics-skill" target="_blank" rel="noopener" aria-label="Decodable Texts"></a>

  <a class="hotspot practice" href="https://literacyarcade.com/build-and-play.html" target="_blank" rel="noopener" aria-label="Phonics Practice"></a>
  <a class="hotspot spelling" href="https://www.reallygreatreading.com/resources/all-resources" target="_blank" rel="noopener" aria-label="Spelling and Word Work"></a>
  <a class="hotspot hfw" href="https://www.reallygreatreading.com/resources/all-resources" target="_blank" rel="noopener" aria-label="High Frequency Words"></a>
  <a class="hotspot games" href="https://soundsforest.com/" target="_blank" rel="noopener" aria-label="Phonics Games"></a>

  <a class="hotspot favnav" href="#" data-coming="My Favorites" aria-label="My Favorites"></a>
  <a class="hotspot resnav" href="#" data-coming="My Resources" aria-label="My Resources"></a>
  <a class="hotspot students" href="#" data-coming="My Students" aria-label="My Students"></a>
  <a class="hotspot settings" href="#" data-coming="Settings" aria-label="Settings"></a>

  <a class="hotspot timer" href="#" data-coming="Class Timer" aria-label="Class Timer"></a>
  <a class="hotspot picker" href="#" data-coming="Student Picker" aria-label="Student Picker"></a>
  <a class="hotspot group" href="#" data-coming="Group Maker" aria-label="Group Maker"></a>
  <a class="hotspot noise" href="#" data-coming="Noise Meter" aria-label="Noise Meter"></a>
  <a class="hotspot message" href="#" data-coming="Morning Message" aria-label="Morning Message"></a>
  <a class="hotspot whatdo" href="#" data-coming="What Can I Do" aria-label="What Can I Do"></a>
</main>

<div id="toast" role="status" aria-live="polite"></div>
<script>
const toast=document.getElementById('toast');
let t;
document.querySelectorAll('[data-coming]').forEach(el=>{
  el.addEventListener('click',e=>{
    e.preventDefault();
    clearTimeout(t);
    toast.textContent=el.dataset.coming+' — coming soon! 💕';
    toast.classList.add('show');
    t=setTimeout(()=>toast.classList.remove('show'),1800);
  });
});
</script>
</body>
</html>
