<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Noise Meter | Teacher Toolbox</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f8d8e5}
body{display:flex;justify-content:center;font-family:Arial,sans-serif;color:#273448}
.stage{position:relative;width:min(100vw,1024px);aspect-ratio:1024/1536;background:#fff;overflow:hidden}
.stage>img{width:100%;height:100%;display:block}
.hotspot{position:absolute;border:0;background:transparent;cursor:pointer;border-radius:18px}
.home{left:2.4%;top:13.4%;width:17.6%;height:4.8%}
.phonics{left:20.8%;top:13.4%;width:18.1%;height:4.8%}
.reading{left:39.7%;top:13.4%;width:18.2%;height:4.8%}
.classroom{left:58.8%;top:13.4%;width:19%;height:4.8%}
.favorites{left:78.3%;top:13.4%;width:19%;height:4.8%}
.help{left:78.4%;top:31.4%;width:7.2%;height:5.2%}
.settings{left:87.1%;top:31.4%;width:7%;height:5.2%}
.shush{left:39%;top:83%;width:14.8%;height:4.1%}
.pause{left:55%;top:83%;width:18.4%;height:4.1%}
.reset{left:74.7%;top:83%;width:18.2%;height:4.1%}
.needle{position:absolute;left:64.8%;top:52%;width:2.4%;height:16.8%;transform-origin:50% 92%;transform:rotate(-55deg);transition:.12s;z-index:5}
.needle:before{content:"";position:absolute;left:35%;top:0;width:30%;height:88%;background:#273448;border-radius:999px}
.needle:after{content:"";position:absolute;left:-30%;bottom:0;width:160%;aspect-ratio:1;border-radius:50%;background:#273448;border:5px solid #172131}
.level{position:absolute;left:37.8%;top:55.5%;width:55.2%;height:8.2%;background:rgba(255,255,255,.88);border-radius:28px;display:grid;place-items:center;font-weight:900;font-size:clamp(18px,3vw,38px);z-index:4}
.alert{position:absolute;left:38%;top:64.9%;width:54.4%;height:9.8%;background:rgba(255,255,255,.92);border-radius:25px;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:4}
.alert.hidden{opacity:0}
.alert .big{font-weight:900;color:#ef4d8d;font-size:clamp(28px,4.5vw,54px)}
.alert .small{font-weight:700;font-size:clamp(13px,1.55vw,18px)}
.status{position:absolute;left:39.2%;top:75.7%;width:24.2%;height:6.4%;background:rgba(255,255,255,.92);border-radius:20px;display:flex;flex-direction:column;justify-content:center;padding:0 8%;font-weight:800;color:#2e8e58;z-index:4}
.bars{display:flex;gap:3px;margin-top:6px}.bars span{width:8px;height:18px;background:#d2d5dc;border-radius:3px}.bars span.on{background:#4fc47a}
.loud{position:absolute;left:65.5%;top:75.7%;width:27.2%;height:6.4%;background:rgba(255,255,255,.92);border-radius:20px;padding:1.1% 1.5%;font-weight:800;z-index:4}
.loud .pink{color:#ef4d8d}.bar{height:8px;background:#e7e9ef;border-radius:99px;margin:7px 0 6px;overflow:hidden}.fill{height:100%;width:0;background:#ef4d8d}
.modal{position:fixed;inset:0;background:#27344855;display:none;place-items:center;padding:18px;z-index:30}.modal.show{display:grid}
.card{width:min(92vw,500px);background:#fffafd;border:4px dashed #f0acc4;border-radius:28px;padding:24px}
.card input{width:100%;padding:12px;border:2px solid #ead9ef;border-radius:14px;font-size:18px}
.actions{display:flex;gap:10px;margin-top:14px}.actions button{flex:1;padding:12px;border:0;border-radius:15px;font-weight:800}.save{background:#cdeedc}.cancel{background:#f6d8e4}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#273448;color:#fff;padding:11px 18px;border-radius:999px;opacity:0;z-index:40}#toast.show{opacity:1}
</style>
</head>
<body>
<main class="stage">
<img src="noise-meter-toolbox-home.png" alt="Teacher Toolbox live classroom noise meter">
<a class="hotspot home" href="index.html"></a>
<a class="hotspot phonics" href="phonics.html"></a>
<a class="hotspot reading" href="reading.html"></a>
<a class="hotspot classroom" href="#" data-coming="Classroom"></a>
<a class="hotspot favorites" href="#" data-coming="Favorites"></a>
<button class="hotspot help" onclick="showToast('Tap the Listening box or Pause Meter to start 🎤')"></button>
<button class="hotspot settings" onclick="openSettings()"></button>
<button class="hotspot shush" onclick="playShush()"></button>
<button class="hotspot pause" onclick="togglePause()"></button>
<button class="hotspot reset" onclick="resetMeter()"></button>

<div id="needle" class="needle"></div>
<div id="level" class="level">0 — Silent</div>
<div id="alert" class="alert hidden"><div class="big">SHHH! 🤫</div><div class="small">Let’s bring our voices down. Thank you! 💕</div></div>
<div id="status" class="status"><div id="listenText">Tap to Start</div><div id="bars" class="bars"></div></div>
<div class="loud"><div><span class="pink">Too loud for:</span> <span id="secs">0.0</span> sec</div><div class="bar"><div id="fill" class="fill"></div></div><div>Alert after <span id="delayText">2.0</span> sec</div></div>
</main>

<div id="settingsModal" class="modal"><div class="card">
<h2>⚙️ Noise Meter Settings</h2>
<p><b>Sensitivity</b> (1–100)</p><input id="threshold" type="number" min="1" max="100" value="45">
<p><b>Alert delay</b> in seconds</p><input id="delay" type="number" min=".5" max="10" step=".5" value="2">
<div class="actions"><button class="cancel" onclick="closeSettings()">Cancel</button><button class="save" onclick="saveSettings()">Save</button></div>
</div></div>
<div id="toast"></div>

<script>
let ctx,analyser,source,stream,data,running=false,paused=false,loudStart=null,shushed=false;
let threshold=Number(localStorage.getItem("ttNoiseThreshold")||45);
let delay=Number(localStorage.getItem("ttNoiseDelay")||2);
const needle=document.getElementById("needle"),levelEl=document.getElementById("level"),alertEl=document.getElementById("alert"),barsEl=document.getElementById("bars"),listenText=document.getElementById("listenText"),secsEl=document.getElementById("secs"),fill=document.getElementById("fill");
document.getElementById("threshold").value=threshold;document.getElementById("delay").value=delay;document.getElementById("delayText").textContent=delay.toFixed(1);
for(let i=0;i<10;i++)barsEl.appendChild(document.createElement("span"));

function showToast(m){let t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(showToast.t);showToast.t=setTimeout(()=>t.classList.remove("show"),1600)}

async function startMeter(){
 if(running)return;
 try{
   stream=await navigator.mediaDevices.getUserMedia({audio:true});
   ctx=new (window.AudioContext||window.webkitAudioContext)();
   analyser=ctx.createAnalyser();analyser.fftSize=512;
   source=ctx.createMediaStreamSource(stream);source.connect(analyser);
   data=new Uint8Array(analyser.fftSize);running=true;paused=false;listenText.textContent="Listening…";loop();
 }catch(e){listenText.textContent="Mic Needed";showToast("Please allow microphone access 💕")}
}

function getLevel(){
 analyser.getByteTimeDomainData(data);let sum=0;
 for(let i=0;i<data.length;i++){let v=(data[i]-128)/128;sum+=v*v}
 return Math.min(100,Math.sqrt(sum/data.length)*260);
}

function loop(){if(!running)return;if(!paused)update(getLevel());requestAnimationFrame(loop)}

function update(v){
 const labels=["0 — Silent","1 — Whisper","2 — Table Talk","3 — Presenter","4 — Outside"];
 const level=Math.min(4,Math.floor(v/20));levelEl.textContent=labels[level];
 needle.style.transform=`rotate(${-55+(v/100)*110}deg)`;
 [...barsEl.children].forEach((b,i)=>b.classList.toggle("on",i<Math.round(v/10)));
 if(v>=threshold){
   if(loudStart===null)loudStart=performance.now();
   const s=(performance.now()-loudStart)/1000;secsEl.textContent=s.toFixed(1);fill.style.width=Math.min(100,(s/delay)*100)+"%";
   if(s>=delay){alertEl.classList.remove("hidden");if(!shushed){shushed=true;playShush()}}
 }else{loudStart=null;shushed=false;secsEl.textContent="0.0";fill.style.width="0%";alertEl.classList.add("hidden")}
}

function playShush(){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance("Shhh");u.rate=.65;u.pitch=1.1;u.volume=.8;speechSynthesis.speak(u)}catch(e){}}
function togglePause(){if(!running){startMeter();return}paused=!paused;listenText.textContent=paused?"Paused":"Listening…";showToast(paused?"Meter paused":"Meter resumed")}
function resetMeter(){loudStart=null;shushed=false;alertEl.classList.add("hidden");secsEl.textContent="0.0";fill.style.width="0%";levelEl.textContent="0 — Silent";needle.style.transform="rotate(-55deg)"}
function openSettings(){document.getElementById("settingsModal").classList.add("show")}
function closeSettings(){document.getElementById("settingsModal").classList.remove("show")}
function saveSettings(){threshold=Math.max(1,Math.min(100,Number(document.getElementById("threshold").value)||45));delay=Math.max(.5,Math.min(10,Number(document.getElementById("delay").value)||2));localStorage.setItem("ttNoiseThreshold",threshold);localStorage.setItem("ttNoiseDelay",delay);document.getElementById("delayText").textContent=delay.toFixed(1);closeSettings();showToast("Settings saved! 💕")}
document.getElementById("status").addEventListener("click",startMeter);
document.querySelectorAll("[data-coming]").forEach(el=>el.onclick=e=>{e.preventDefault();showToast(el.dataset.coming+" — coming soon! 💕")});
</script>
</body></html>
