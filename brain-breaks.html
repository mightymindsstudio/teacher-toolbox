<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brain Break Machine</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  background:#fffaf5;
  font-family:Arial,Helvetica,sans-serif;
}

.back{
  display:inline-block;
  margin:10px 12px;
  padding:9px 14px;
  background:#fff;
  border-radius:999px;
  text-decoration:none;
  color:#6f6786;
  font-weight:800;
  box-shadow:0 4px 14px rgba(0,0,0,.1);
}

.stage{
  position:relative;
  width:100%;
  max-width:1536px;
  margin:auto;
  aspect-ratio:3/2;
}

.stage img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}

.hit{
  position:absolute;
  border:0;
  background:transparent;
  cursor:pointer;
  z-index:20;
  -webkit-tap-highlight-color:transparent;
}

/* CATEGORY BUTTONS */

.energize{
  left:1.3%;
  top:19.1%;
  width:14.7%;
  height:15.5%;
}

.calm{
  left:16.7%;
  top:19.1%;
  width:16.2%;
  height:15.5%;
}

.move{
  left:33.8%;
  top:19.1%;
  width:15.0%;
  height:15.5%;
}

.silly{
  left:49.6%;
  top:19.1%;
  width:14.8%;
  height:15.5%;
}

.focus{
  left:65.4%;
  top:19.1%;
  width:16.4%;
  height:15.5%;
}

.surprise{
  left:82.8%;
  top:19.1%;
  width:15.1%;
  height:15.5%;
}

/* GUMBALL BUTTON */

.give{
  left:16%;
  top:50%;
  width:29%;
  height:20%;
}

/* RESULT AREA */

.result{
  position:absolute;
  z-index:12;
  left:50.8%;
  top:39.5%;
  width:44%;
  height:33%;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  pointer-events:none;
}

.result-inner{
  width:88%;
  padding:0;
}

.emoji{
  font-size:clamp(22px,3vw,48px);
  line-height:1;
  margin-bottom:7px;
}

.title{
  font-weight:900;
  color:#149eb0;
  font-size:clamp(16px,2.8vw,42px);
  line-height:1.05;
  margin:0 0 14px;
}

.desc{
  color:#222;
  font-weight:700;
  font-size:clamp(10px,1.4vw,21px);
  line-height:1.25;
  max-width:82%;
  margin:auto;
}

.duration{
  display:none;
}

/* TIMER */

.timer{
  position:absolute;
  z-index:14;
  left:51.2%;
  top:77.4%;
  width:20.4%;
  height:9.4%;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-weight:900;
  color:#129daf;
  font-size:clamp(16px,2.7vw,42px);
  line-height:1;
  background:#fffaf5;
  border-radius:18px;
  pointer-events:none;
}

/* START */

.start{
  left:73.4%;
  top:77.5%;
  width:20.2%;
  height:9.5%;
}

/* ANOTHER ONE */

.another{
  left:50.7%;
  top:89.1%;
  width:43.0%;
  height:9.1%;
}

/* COMPLETION MESSAGE */

.celebrate{
  position:absolute;
  z-index:30;
  left:54%;
  top:69%;
  width:37%;
  text-align:center;
  font-size:clamp(11px,1.5vw,23px);
  font-weight:900;
  color:#ff5b8a;
  background:#fff7c7;
  border-radius:999px;
  padding:5px 8px;
  opacity:0;
  transition:.2s;
  pointer-events:none;
}

.celebrate.show{
  opacity:1;
}

/* CONFETTI */

.confetti{
  position:fixed;
  top:-30px;
  pointer-events:none;
  z-index:9999;
  animation:fall 2.7s linear forwards;
}

@keyframes fall{
  to{
    transform:translateY(110vh) rotate(700deg);
    opacity:.85;
  }
}

@media(max-width:600px){
  .back{
    font-size:12px;
    padding:7px 11px;
  }
}
</style>
</head>

<button class="hit energize" data-cat="energize" aria-label="Energize"></button>

<button class="hit move" data-cat="move" aria-label="Move It"></button>

<button class="hit silly" data-cat="silly" aria-label="Silly"></button>

<button class="hit focus" data-cat="focus" aria-label="Focus Boost"></button>

<button class="hit surprise" data-cat="surprise" aria-label="Surprise Me"></button>

<!-- GUMBALL MACHINE BUTTON -->

<button
class="hit give"
id="giveBreak"
aria-label="Give us a brain break">
</button>

<!-- RESULT -->

<div class="result">
  <div class="result-inner">

    <div class="emoji" id="emoji">⚡</div>

    <div class="title" id="title">
      Jumping Jacks!
    </div>

    <div class="desc" id="desc">
      Do 20 jumping jacks together!
    </div>

    <div class="duration" id="duration"></div>

  </div>
</div>

<!-- TIMER -->

<div class="timer" id="timer">
00:30
</div>

<!-- BUTTON HOTSPOTS -->

<button
class="hit start"
id="startBtn"
aria-label="Start timer">
</button>

<button
class="hit another"
id="anotherBtn"
aria-label="Another brain break">
</button>
