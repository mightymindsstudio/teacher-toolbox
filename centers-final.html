<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Centers | Teacher Toolbox</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  background:#fffaf7;
  font-family:Arial,sans-serif;
}

body{
  display:flex;
  justify-content:center;
}

.stage{
  position:relative;
  width:min(100vw,1024px);
  aspect-ratio:2/3;
}

.stage>img{
  width:100%;
  height:100%;
  display:block;
}

.hit{
  position:absolute;
  display:block;
  border:0;
  background:transparent;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

/* TOP */
.home{
  left:1.8%;
  top:2.3%;
  width:16%;
  height:5.8%;
}

.favorites{
  left:82%;
  top:2.3%;
  width:16%;
  height:5.8%;
}

/* MAIN CARDS */
.rotation{
  left:3.2%;
  top:29.8%;
  width:30%;
  height:34.3%;
}

.skill{
  left:35.2%;
  top:29.8%;
  width:29.5%;
  height:34.3%;
}

.quick{
  left:66%;
  top:29.8%;
  width:30%;
  height:34.3%;
}

/* QUICK TOOLS */
.timer{
  left:3%;
  top:72.3%;
  width:14%;
  height:15.5%;
}

.picker{
  left:18.4%;
  top:72.3%;
  width:14%;
  height:15.5%;
}

.group{
  left:33.8%;
  top:72.3%;
  width:14%;
  height:15.5%;
}

.noise{
  left:49.3%;
  top:72.3%;
  width:14%;
  height:15.5%;
}

.message{
  left:64.8%;
  top:72.3%;
  width:14%;
  height:15.5%;
}

.whatdo{
  left:80.2%;
  top:72.3%;
  width:14%;
  height:15.5%;
}

/* BOTTOM BACK BUTTON */
.back{
  left:28%;
  top:92.4%;
  width:39%;
  height:5%;
}

/* MODAL */
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#17315d66;
  z-index:20;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.modal.show{
  display:flex;
}

.box{
  background:#fffaf7;
  border:3px solid #ff9fbd;
  border-radius:24px;
  padding:22px;
  max-width:560px;
  width:100%;
  box-shadow:0 10px 35px #17315d33;
  color:#17315d;
}

.box h2{
  color:#ef5d8b;
  margin-top:0;
}

.ideas{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.idea{
  padding:11px;
  border-radius:14px;
  background:#fff0f5;
  font-weight:700;
}

.close{
  float:right;
  border:0;
  border-radius:50%;
  width:36px;
  height:36px;
  background:#f3e9ff;
  font-size:22px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="stage">

<img
src="centers-final-bg.PNG"
alt="Centers Teacher Toolbox">

<a
class="hit home"
href="teacher-toolbox-home-new.html"
aria-label="Home">
</a>

<a
class="hit favorites"
href="#"
onclick="alert('My Favorites — coming soon! 💕');return false;"
aria-label="My Favorites">
</a>

<a
class="hit rotation"
href="center-rotation-board-cute.html?v=8001"
aria-label="Center Rotation Board">
</a>

<a
class="hit skill"
href="skill-based-centers.html?v=1"
aria-label="Skill-Based Center Ideas">
</a>

<button
class="hit quick"
onclick="openQuick()"
aria-label="Quick Center Ideas">
</button>

<a
class="hit timer"
href="timer.html"
aria-label="Class Timer">
</a>

<a
class="hit picker"
href="student-picker.html"
aria-label="Student Picker">
</a>

<a
class="hit group"
href="group-maker.html"
aria-label="Group Maker">
</a>

<a
class="hit noise"
href="noise-meter.html"
aria-label="Noise Meter">
</a>

<a
class="hit message"
href="morning-message-final.html?v=2"
aria-label="Morning Message">
</a>

<a
class="hit whatdo"
href="what-can-i-do.html?v=3"
aria-label="What Can I Do">
</a>

<a
class="hit back"
href="teacher-toolbox-home-new.html"
aria-label="Back to Teacher Toolbox">
</a>

</div>

<div
class="modal"
id="modal"
onclick="if(event.target===this)closeM()">

<div class="box">

<button class="close" onclick="closeM()">×</button>

<h2>💕 Quick Center Ideas</h2>

<div class="ideas">

<div class="idea">📚 Read to Self</div>
<div class="idea">🔤 Word Work</div>
<div class="idea">👯 Read with a Buddy</div>
<div class="idea">🎧 Listen to Reading</div>
<div class="idea">🎨 Create</div>
<div class="idea">🤝 Partner</div>

</div>

</div>
</div>

<script>
function openQuick(){
  document.getElementById('modal').classList.add('show');
}

function closeM(){
  document.getElementById('modal').classList.remove('show');
}
</script>

</body>
</html>
