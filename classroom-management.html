<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Classroom Management | Teacher Toolbox</title>

<style>

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  background:#fff8f5;
}

body{
  display:flex;
  justify-content:center;
  font-family:Arial,sans-serif;
}

.stage{
  position:relative;
  width:min(100vw,1536px);
}

.stage img{
  display:block;
  width:100%;
  height:auto;
}

/* INVISIBLE CLICKABLE AREAS */

.hit{
  position:absolute;
  display:block;
  border:0;
  background:transparent;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

/* FEATURED TOOLS */

.behavior{
  left:17.5%;
  top:42%;
  width:20.5%;
  height:17%;
}

.rewards{
  left:38.4%;
  top:42%;
  width:21.5%;
  height:17%;
}

.calm{
  left:60.1%;
  top:42%;
  width:21.8%;
  height:17%;
}

/* QUICK MANAGEMENT TOOLS */

.q1{
  left:13.5%;
  top:65%;
  width:17%;
  height:26%;
}

.q2{
  left:31%;
  top:65%;
  width:17.5%;
  height:26%;
}

.q3{
  left:48.8%;
  top:65%;
  width:16.8%;
  height:26%;
}

.q4{
  left:65.8%;
  top:65%;
  width:16.8%;
  height:26%;
}

/* POP-UP MESSAGE */

.toast{
  position:fixed;
  left:50%;
  bottom:20px;
  transform:translateX(-50%);
  background:#17315d;
  color:white;
  padding:12px 18px;
  border-radius:30px;
  opacity:0;
  transition:.2s;
  z-index:30;
  text-align:center;
  max-width:90%;
}

.toast.show{
  opacity:1;
}

</style>
</head>

<body>

<div class="stage">

<img
src="https://raw.githubusercontent.com/mightymindsstudio/teacher-toolbox/main/classroom-management-cute-2026.PNG"
alt="Classroom Management Teacher Toolbox">

<a
class="hit behavior"
href="behavior-tracker.html?v=1"
aria-label="Behavior Tracker">
</a>

<button
class="hit rewards"
onclick="toast('Classroom Rewards is coming soon! ⭐')"
aria-label="Classroom Rewards">
</button>

<button
class="hit calm"
onclick="toast('Calm-Down Corner is coming soon! 🌈')"
aria-label="Calm-Down Corner">
</button>

<button
class="hit q1"
onclick="toast('Attention Getters are coming soon! 📣')"
aria-label="Attention Getters">
</button>

<button
class="hit q2"
onclick="toast('Transition Ideas are coming soon! ⏰')"
aria-label="Transition Ideas">
</button>

<button
class="hit q3"
onclick="toast('Classroom Jobs are coming soon! 📋')"
aria-label="Classroom Jobs">
</button>

<button
class="hit q4"
onclick="toast('Brain Breaks are coming soon! 🧠')"
aria-label="Brain Breaks">
</button>

</div>

<div class="toast" id="toast"></div>

<script>

let tt;

function toast(message){

  const t=document.getElementById("toast");

  t.textContent=message;
  t.classList.add("show");

  clearTimeout(tt);

  tt=setTimeout(()=>{
    t.classList.remove("show");
  },1800);

}

</script>

</body>
</html>
