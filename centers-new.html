<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Centers | Teacher Toolbox</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#fff7f8}body{display:flex;justify-content:center;font-family:Arial,sans-serif}
.stage{position:relative;width:min(100vw,1024px);aspect-ratio:2/3}.stage>img{width:100%;height:100%;display:block}
.hit{position:absolute;display:block;border:0;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent}
.back{left:1%;top:2%;width:18%;height:5%}.rotation{left:6%;top:34.3%;width:25%;height:4%}.plan{left:40%;top:34.3%;width:21%;height:4%}.skill{left:70%;top:34.3%;width:23%;height:4%}
.q1{left:4%;top:66%;width:13%;height:4%}.q2{left:20%;top:66%;width:13%;height:4%}.q3{left:36%;top:66%;width:13%;height:4%}.q4{left:52%;top:66%;width:13%;height:4%}.q5{left:68%;top:66%;width:13%;height:4%}.q6{left:84%;top:66%;width:13%;height:4%}
.bottom{left:65%;top:96%;width:18%;height:3%}.top{left:85%;top:96%;width:11%;height:3%}
.notes{position:absolute;left:5%;top:84.2%;width:61%;height:9%;border:0;background:transparent;resize:none;padding:12px 16px;font:16px "Trebuchet MS",Arial;color:#16335e;outline:none}
.modal{display:none;position:fixed;inset:0;background:#17315d66;z-index:20;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.box{background:#fffaf7;border:3px solid #ff9fbd;border-radius:24px;padding:22px;max-width:540px;width:100%;box-shadow:0 10px 35px #17315d33;color:#17315d}.box h2{color:#ef5d8b}.ideas{display:grid;grid-template-columns:1fr 1fr;gap:9px}.idea{padding:10px;border-radius:12px;background:#fff0f5;font-weight:700}.close{float:right;border:0;border-radius:50%;width:36px;height:36px;background:#f3e9ff;font-size:22px}
.toast{position:fixed;bottom:20px;background:#17315d;color:white;padding:10px 16px;border-radius:30px;opacity:0;transition:.2s}.toast.show{opacity:1}
</style></head><body>
<div class="stage" id="top"><img src="centers-cute-bg.png" alt="Cute Centers Teacher Toolbox page">
<a class="hit back" href="./?v=2001" aria-label="Back to Teacher Toolbox"></a>
<a class="hit rotation" href="center-rotation-board.html?v=2001" aria-label="Open Rotation Board"></a>
<a class="hit plan" href="plan-my-centers.html?v=4001" aria-label="Plan My Centers"></a>
<button class="hit skill" onclick="toast('Skill-Based Centers is coming next! 🎯')" aria-label="Skill-Based Centers"></button>
<button class="hit q1" onclick="ideas('Read to Self')"></button><button class="hit q2" onclick="ideas('Word Work')"></button>
<button class="hit q3" onclick="ideas('Read with a Buddy')"></button><button class="hit q4" onclick="ideas('Listen to Reading')"></button>
<button class="hit q5" onclick="ideas('Create')"></button><button class="hit q6" onclick="ideas('Partner')"></button>
<textarea class="notes" id="notes" aria-label="Teacher Notes" placeholder="Write notes, reminders, or ideas here..."></textarea>
<a class="hit bottom" href="./?v=2001"></a><a class="hit top" href="#top"></a></div>
<div class="modal" id="modal" onclick="if(event.target===this)closeM()"><div class="box"><button class="close" onclick="closeM()">×</button><h2 id="title"></h2><div class="ideas" id="list"></div></div></div><div class="toast" id="toast"></div>
<script>
const data={
"Read to Self":["Book Nook","Reading Stamina","Independent Reading","Read & Retell","Character Detective","Story Map","Favorite Part","Picture Walk"],
"Word Work":["Letter Fun","Phonics Games","Spelling Practice","Build It With Letters","Rainbow Write","Word Sort","Word Hunt","Change-a-Sound"],
"Read with a Buddy":["Buddy Reading","Partner Talk","Retell Together","Take Turns Reading","Character Chat","Sequence Together","Ask & Answer","Favorite Part Share"],
"Listen to Reading":["Audiobooks","Read-Aloud","Listening Center","Listen & Retell","Draw What You Heard","Story Sequence","Favorite Part","Character Hunt"],
"Create":["Draw & Write","Craft & Build","Design & Make","Story Illustration","STEM Build","Shape Picture","Make a Poster","Build a Model"],
"Partner":["Math Partners","Game Time","Problem Solve","Quiz a Friend","Roll & Solve","Memory Match","Teach Your Partner","Task Card Team"]};
function ideas(k){document.getElementById('title').textContent=k+' Ideas';document.getElementById('list').innerHTML=data[k].map(x=>'<div class="idea">♡ '+x+'</div>').join('');document.getElementById('modal').classList.add('show')}
function closeM(){document.getElementById('modal').classList.remove('show')}
let tt;function toast(m){let t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1800)}
let n=document.getElementById('notes');n.value=localStorage.getItem('teacherCenterNotes')||'';n.addEventListener('input',()=>localStorage.setItem('teacherCenterNotes',n.value));
</script></body></html>
